# VM 100 — /etc/nginx/sites-available/00-default-ssl.conf  (symlink vào sites-enabled)
# Request HTTPS tới IP trần hoặc tên miền không có server block riêng: từ chối ngay ở bước
# bắt tay TLS, không đưa ra chứng chỉ của site nào. Yêu cầu nginx >= 1.19.4 (Debian 12: 1.22).
# Trước khi bật: KHÔNG được có server block nào khác khai "listen 443 ... default_server".
#   grep -Rn "default_server" /etc/nginx/sites-enabled/
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
