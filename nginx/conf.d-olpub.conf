# VM 100 — /etc/nginx/conf.d/olpub.conf — nạp trong khối http (Debian mặc định include conf.d/*.conf).
# Nếu nginx.conf của bạn không include conf.d, dán các khối dưới vào khối http của nginx.conf.

# read.tapama.cloud: giới hạn tốc độ request, số kết nối đồng thời, băng thông tải PDF
limit_req_zone  $binary_remote_addr zone=readlimit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=readconn:10m;
map $uri $olpub_rate {
    ~\.pdf$  2m;
    default  0;          # 0 = không giới hạn
}

# Lấy nonce CSP mà Overleaf sinh cho từng trang editor, để thẻ <script> chèn vào
# được trình duyệt chấp nhận. Overleaf CE bật CSP mặc định:
#   script-src 'nonce-XXX' 'unsafe-inline' 'strict-dynamic' https: ...
# Với 'strict-dynamic', script không có nonce bị chặn — kể cả cùng origin.
map $upstream_http_content_security_policy $olpub_nonce {
    "~'nonce-(?<olpub_n>[A-Za-z0-9+/=_-]+)'"  $olpub_n;
    default                                    "";
}
