# /etc/nginx/sites-available/overleaf.conf — Overleaf sau mTLS + Authelia, kèm chức năng publish.
# Sao lưu bản cũ trước khi sửa:  cp overleaf.conf overleaf.conf.pre-olpub   (không symlink)
#
# Thứ tự kiểm tra một request:
#   1. TLS: thiếu/sai chứng chỉ thiết bị -> 400, chưa chạm Authelia hay Overleaf
#   2. auth_request tới Authelia (group overleaf, two_factor)
#   3. Overleaf tự kiểm đăng nhập của nó

server {
    listen 443 ssl;
    server_name overleaf.tapama.cloud;

    ssl_certificate     /etc/letsencrypt/live/overleaf.tapama.cloud/fullchain.pem;   # step-ca, như cũ
    ssl_certificate_key /etc/letsencrypt/live/overleaf.tapama.cloud/privkey.pem;
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    # --- (1) mTLS thiết bị: giống wazuh/pfsense/proxmox (mục 5.4, 7) ---
    include snippets/mtls-device.conf;
    ssl_verify_client on;

    access_log /var/log/nginx/overleaf.access.log mtls;
    error_log  /var/log/nginx/overleaf.error.log;

    client_max_body_size 100M;     # giữ như cũ — chỉ khai ở cấp server (mục 5.4)

    # --- (2) Authelia: CHÉP NGUYÊN các dòng Authelia đang dùng trong wazuh.conf vào đây ---
    # Ví dụ (theo mẫu chính thức của Authelia; thay bằng đúng cách của bạn):
    #   include snippets/authelia.conf;            # location nội bộ + auth_request ở cấp server
    # Yêu cầu: auth_request phải áp dụng cho MỌI location bên dưới (khai ở cấp server
    # thì các location tự kế thừa).

    # Trang editor: chèn nút Publish kèm đúng nonce CSP của trang
    location ~ "^/project/[0-9a-f]{24}$" {
        include snippets/proxy-params.conf;
        proxy_set_header Accept-Encoding "";          # sub_filter cần HTML chưa nén
        sub_filter '</body>' '<script nonce="$olpub_nonce" src="/_pub/button.js" defer></script></body>';
        sub_filter_once on;
        proxy_pass http://10.0.30.56:80;
    }

    # API + giao diện publish -> VM 1007 cổng ADMIN. Danh tính do Nginx gắn,
    # GHI ĐÈ mọi header cùng tên do client tự gửi.
    location /_pub/ {
        auth_request_set $olpub_user $upstream_http_remote_user;
        include snippets/proxy-params.conf;
        proxy_set_header X-Pub-User   $olpub_user;
        proxy_set_header X-Pub-Device $ssl_client_s_dn;
        proxy_set_header Cookie       "";             # publisher không cần cookie Overleaf/Authelia
        proxy_pass http://10.0.30.57:8082;
    }

    # Mọi thứ còn lại (kể cả WebSocket /socket.io) -> Overleaf như cũ
    location / {
        include snippets/proxy-params.conf;
        proxy_pass http://10.0.30.56:80;
    }
}
