# VM 100 — /etc/nginx/sites-available/read.conf — trang xem công khai. KHÔNG mTLS, KHÔNG Authelia.
# Chứng chỉ Let's Encrypt (không phải step-ca) để người ngoài và công cụ AI tải được.
# Phía sau là Nginx tĩnh trên VM 1007 (bản 1.1): không còn code Python nào trả lời người xem.

server {
    listen 443 ssl;
    server_name read.tapama.cloud;

    ssl_certificate     /etc/letsencrypt/live/read.tapama.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/read.tapama.cloud/privkey.pem;
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;   # nosniff, X-Frame-Options SAMEORIGIN, Referrer-Policy

    access_log /var/log/nginx/read.access.log;
    error_log  /var/log/nginx/read.error.log;

    client_max_body_size 1k;

    # Không phục vụ đường dẫn quản trị ở host công khai (phòng cấu hình nhầm)
    location /_pub/ { return 404; }

    location / {
        limit_except GET HEAD { deny all; }
        limit_req  zone=readlimit burst=20 nodelay;
        limit_conn readconn 6;                 # tối đa 6 kết nối đồng thời mỗi IP
        limit_rate_after 8m;                   # 8MB đầu tải nhanh, sau đó
        limit_rate $olpub_rate;                # .pdf giới hạn 2MB/s mỗi kết nối (map trong conf.d/olpub.conf)
        include snippets/proxy-params.conf;
        # Không mang cookie *.tapama.cloud (Authelia...) hay header danh tính xuống DMZ
        proxy_set_header Cookie        "";
        proxy_set_header Authorization "";
        proxy_set_header X-Pub-User    "";
        proxy_set_header X-Pub-Device  "";
        proxy_pass http://10.0.30.57:8080;
    }
}
