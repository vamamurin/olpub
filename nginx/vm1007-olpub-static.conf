# VM 1007 — /etc/nginx/sites-available/olpub-static
# Nginx CHỈ phục vụ file tĩnh do publisher sinh sẵn. Không proxy, không chạy code.
# Người xem đi: Internet -> Nginx VM 100 (TLS, rate limit) -> Nginx này :8080 -> file trên đĩa.

# CSP theo loại nội dung ($olpub_ext lấy từ regex của location bên dưới)
map $olpub_ext $olpub_csp {
    ""      "default-src 'none'; style-src 'self'; frame-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    ".pdf"  "frame-ancestors 'self'";
    default "default-src 'none'; sandbox; frame-ancestors 'none'";
}
# Trang HTML tự khai <meta name="robots"> theo lựa chọn của chủ tài liệu;
# bản .pdf/.txt/.tex luôn noindex để công cụ tìm kiếm chỉ trỏ về trang chính.
map $olpub_ext $olpub_robots {
    ""      "";
    default "noindex";
}
# /<slug> -> <slug>.html ; /<slug>.pdf -> <slug>.pdf (không bao giờ rơi sang file khác)
map $olpub_ext $olpub_suffix {
    ""      ".html";
    default $olpub_ext;
}
map $olpub_ext $olpub_disposition {
    ".pdf"  'inline; filename="$olpub_slug.pdf"';
    default "";
}

server {
    listen 8080 default_server;
    server_name _;
    root /srv/olpub/www;

    server_tokens off;
    autoindex off;
    disable_symlinks on;
    client_max_body_size 1k;
    keepalive_timeout 15s;

    types {
        text/html       html;
        application/pdf pdf;
        text/plain      txt tex;
        text/css        css;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/plain text/css;      # text/html luôn được gắn charset sẵn

    access_log /var/log/nginx/olpub-static.access.log;
    error_log  /var/log/nginx/olpub-static.error.log;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /read.css {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # /<slug>  /<slug>.pdf  /<slug>.txt  /<slug>.tex
    location ~ "^/(?<olpub_slug>[a-z0-9][a-z0-9-]{2,62}[a-z0-9])(?<olpub_ext>\.(?:pdf|txt|tex))?$" {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $olpub_csp always;
        add_header X-Robots-Tag $olpub_robots always;
        add_header Content-Disposition $olpub_disposition always;
        try_files /$olpub_slug$olpub_suffix =404;
    }

    # Trang gốc và mọi đường dẫn khác: 404 trống, không liệt kê gì
    location / {
        return 404;
    }
}
