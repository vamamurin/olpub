# VM 1007 — /etc/nginx/sites-available/olpub-static
# Nginx CHỈ phục vụ file tĩnh do publisher sinh sẵn. Không proxy, không chạy code.
#   /<tên> và /<tên>.pdf -> file PDF (hiển thị bằng trình xem có sẵn của trình duyệt)
#   /<tên>.txt           -> văn bản trích từ PDF (không hiện trên panel, dùng khi cần cho AI)
# Index: PDF của tài liệu bật "Cho phép Google/Bing" nằm trong indexed/. Tìm ở thư mục
# thường trước (gắn noindex), không thấy mới tìm trong indexed/ (không gắn noindex).

# Đường dẫn file theo URL (tính từ $uri, dùng được ở cả location thường lẫn named location)
map $uri $olpub_file {
    "~^/(?<s>[a-z0-9][a-z0-9-]{2,62}[a-z0-9])$"                  /$s.pdf;
    "~^/(?<s>[a-z0-9][a-z0-9-]{2,62}[a-z0-9])\.(?<e>pdf|txt)$"   /$s.$e;
    default                                                      "";
}
map $olpub_file $olpub_csp {
    "~\.pdf$"  "frame-ancestors 'self'";
    default    "default-src 'none'; sandbox; frame-ancestors 'none'";
}
map $olpub_file $olpub_disposition {
    "~^/(?<s>.+)\.pdf$"  'inline; filename="$s.pdf"';
    default              "";
}

server {
    listen 8080 default_server;
    server_name _;
    root /srv/olpub/www;

    server_tokens off;
    autoindex off;
    disable_symlinks on;
    client_max_body_size 1k;
    keepalive_timeout 15s;

    types {
        application/pdf pdf;
        text/plain      txt;
        text/css        css;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/plain text/css;

    access_log /var/log/nginx/olpub-static.access.log;
    error_log  /var/log/nginx/olpub-static.error.log;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Tài liệu thường: noindex. Không thấy file ở đây thì thử bản được phép index.
    location ~ "^/[a-z0-9][a-z0-9-]{2,62}[a-z0-9](\.(pdf|txt))?$" {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $olpub_csp always;
        add_header Content-Disposition $olpub_disposition always;
        add_header X-Robots-Tag "noindex" always;
        try_files $olpub_file @olpub_indexed;
    }

    # Tài liệu bật "Cho phép Google/Bing": không gắn X-Robots-Tag
    location @olpub_indexed {
        root /srv/olpub/www/indexed;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $olpub_csp always;
        add_header Content-Disposition $olpub_disposition always;
        try_files $olpub_file =404;
    }

    # Trang gốc và mọi đường dẫn khác (kể cả /indexed/..., .html, .tex): 404
    location / {
        return 404;
    }
}
